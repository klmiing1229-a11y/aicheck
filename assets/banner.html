<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:640px;background:#07070c;font-family:-apple-system,"SF Pro Display","Inter","Helvetica Neue",sans-serif;color:#f2f2f7;overflow:hidden;position:relative}
.glow1{position:absolute;left:-160px;top:-120px;width:720px;height:720px;background:radial-gradient(circle,rgba(124,58,237,.38),transparent 65%)}
.glow2{position:absolute;right:-140px;bottom:-200px;width:760px;height:760px;background:radial-gradient(circle,rgba(34,211,238,.26),transparent 65%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:40px 40px;-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 25%,transparent 78%)}
.word{position:absolute;left:84px;top:150px}
.tag{font-size:15px;letter-spacing:.28em;color:#a78bfa;text-transform:uppercase;font-family:"SF Mono",Menlo,monospace}
h1{font-size:176px;font-weight:800;letter-spacing:-.06em;line-height:1;margin-top:10px;background:linear-gradient(100deg,#fff 20%,#c4b5fd 60%,#67e8f9);-webkit-background-clip:text;color:transparent}
.sub{font-size:34px;color:#c9c9d6;margin-top:14px;font-weight:500;letter-spacing:-.01em}
.sub b{color:#fff;font-weight:600}
.pill{position:absolute;left:84px;bottom:64px;font-family:"SF Mono",Menlo,monospace;font-size:20px;color:#9ca3af;padding:12px 20px;border:1px solid rgba(255,255,255,.14);border-radius:12px;background:rgba(255,255,255,.04)}
.pill span{color:#67e8f9}
svg{position:absolute;right:0;top:0}
</style></head><body>
